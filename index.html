<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' data:; img-src data: blob:; font-src data:; media-src data: blob:; frame-src about: blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Pocket Wayback</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1a;--mute:#6c6a66;--line:#e4e1db;--acc:#2f5d50;--accink:#fff;--add:#e3f3e6;--addt:#14622a;--del:#fbe4e2;--delt:#a3261b;--warn:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--ink:#ecebe7;--mute:#9a978f;--line:#2e2d2a;--acc:#7fc4ac;--accink:#0b1a15;--add:#173222;--addt:#7ee0a0;--del:#3a1b18;--delt:#ff9d92;--warn:#3a321a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.full{padding-bottom:0}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:14px 16px;max-width:720px;margin:0 auto}
nav.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
body.full nav.bar{display:none}
nav.bar a{flex:1;text-align:center;padding:10px 0 9px;color:var(--mute);text-decoration:none;font-size:12px}
nav.bar a b{display:block;font-size:20px;line-height:1.1;font-weight:400}
nav.bar a.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
a.row{display:block;color:inherit;text-decoration:none}
.host{font-weight:600;word-break:break-all}
.mute{color:var(--mute);font-size:13px}
.path{color:var(--mute);font-weight:400}
input[type=text],input[type=search],input[type=datetime-local],textarea,select{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:160px;font:13px/1.5 ui-monospace,Menlo,monospace}
label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--accink);cursor:pointer;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--delt);border:1px solid var(--line)}
button:disabled{opacity:.4}
.icon{background:transparent;color:var(--ink);border:0;font-size:20px;padding:6px 10px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.pill.chg{color:var(--addt);background:var(--add);border-color:transparent}
.snap{display:flex;gap:12px;align-items:flex-start}
.snap input{margin-top:5px;width:20px;height:20px}
.snap .body{flex:1;min-width:0}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.note{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.vbar{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.vbar select{flex:1;min-width:0;padding:7px 10px}
.vwrap{flex:1;position:relative;background:#fff}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
pre.txt{margin:0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));white-space:pre-wrap;word-break:break-word;font:14px/1.7 -apple-system,"Hiragino Sans",sans-serif;overflow:auto;position:absolute;inset:0;background:var(--bg);color:var(--ink)}
.d{font:13px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;padding:3px 10px;border-radius:4px;margin:1px 0}
.d.p{background:var(--add);color:var(--addt)}
.d.m{background:var(--del);color:var(--delt)}
.d.e{color:var(--mute)}
.d.s{color:var(--mute);text-align:center;font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
h2{font-size:15px;margin:22px 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<nav class="bar" id="nav">
  <a href="#/" data-n="home"><b>🗂</b>アーカイブ</a>
  <a href="#/add" data-n="add"><b>＋</b>追加</a>
  <a href="#/s" data-n="s"><b>⚙</b>設定</a>
</nav>

<script>
'use strict';
/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const toLocalInput=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(16)}

/* ---------- IndexedDB ---------- */
let db;
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('pocket-wayback',1);
  r.onupgradeneeded=()=>{const d=r.result;const s=d.createObjectStore('snaps',{keyPath:'id',autoIncrement:true});s.createIndex('url','url');d.createObjectStore('body',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
const allSnaps=()=>rq(db.transaction('snaps').objectStore('snaps').getAll());
const getSnap=id=>rq(db.transaction('snaps').objectStore('snaps').get(id));
const getBody=id=>rq(db.transaction('body').objectStore('body').get(id));
function saveSnap(meta,body){return new Promise((res,rej)=>{
  const t=db.transaction(['snaps','body'],'readwrite');
  const r=t.objectStore('snaps').add(meta);
  r.onsuccess=()=>{meta.id=r.result;body.id=r.result;t.objectStore('body').put(body)};
  t.oncomplete=()=>res(meta);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
})}
function delSnaps(ids){return new Promise((res,rej)=>{
  const t=db.transaction(['snaps','body'],'readwrite');
  ids.forEach(id=>{t.objectStore('snaps').delete(id);t.objectStore('body').delete(id)});
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
})}
function clearAll(){return new Promise((res,rej)=>{
  const t=db.transaction(['snaps','body'],'readwrite');
  t.objectStore('snaps').clear();t.objectStore('body').clear();
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
})}
function scanBodies(q){return new Promise((res,rej)=>{
  const hits=new Map();const needle=q.toLowerCase();
  const c=db.transaction('body').objectStore('body').openCursor();
  c.onsuccess=()=>{const cur=c.result;if(!cur){res(hits);return}
    const i=cur.value.text.toLowerCase().indexOf(needle);
    if(i>=0)hits.set(cur.value.id,cur.value.text.slice(Math.max(0,i-30),i+90).replace(/\n/g,' '));
    cur.continue()};
  c.onerror=()=>rej(c.error);
})}

/* ---------- text / html helpers ---------- */
function htmlToText(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  d.querySelectorAll('script,style,noscript,template,svg,head').forEach(e=>e.remove());
  d.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6,tr,br,section,article,header,footer,blockquote,pre,ul,ol,table,dd,dt').forEach(e=>e.append('\n'));
  const t=(d.body?d.body.textContent:'')||'';
  return t.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
}
const looksHtml=s=>/<(html|body|head|div|p|span|h[1-6]|a|table|ul|ol|article|section|script|style|meta|link|img)[\s>\/]/i.test(s.slice(0,200000));
function normUrl(u){
  u=(u||'').trim();if(!u)return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)&&/^[^\s\/]+\.[^\s\/]+/.test(u))u='https://'+u;
  return u.replace(/#.*$/,'');
}
function splitUrl(u){try{const x=new URL(u);return {host:x.host||x.protocol,path:(x.pathname+x.search).replace(/^\/$/,'')}}catch{return {host:u,path:''}}}

/* ---------- MHTML ---------- */
function bin2str(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return s}
function str2bytes(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a}
function dec(bytes,cs){try{return new TextDecoder(cs||'utf-8').decode(bytes)}catch{return new TextDecoder('utf-8').decode(bytes)}}
const qpToBin=s=>s.replace(/=\r?\n/g,'').replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
function parseHeaders(h){const o={};h.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim()});return o}
function parseMhtml(raw){
  const he=raw.search(/\r?\n\r?\n/);if(he<0)return null;
  const top=parseHeaders(raw.slice(0,he));
  const bm=/boundary="?([^";]+)"?/i.exec(top['content-type']||'');if(!bm)return null;
  const secs=raw.slice(he).split('--'+bm[1]);
  const parts=[];
  for(let k=1;k<secs.length;k++){
    const p=secs[k];if(p.startsWith('--'))break;
    const i=p.search(/\r?\n\r?\n/);if(i<0)continue;
    const h=parseHeaders(p.slice(0,i));
    const body=p.slice(i).replace(/^\r?\n\r?\n/,'').replace(/\r?\n$/,'');
    const enc=(h['content-transfer-encoding']||'').toLowerCase();
    const ct=(h['content-type']||'application/octet-stream').split(';')[0].trim().toLowerCase();
    const csm=/charset="?([^";]+)/i.exec(h['content-type']||'');
    let bin,b64=null;
    try{
      if(enc==='base64'){b64=body.replace(/\s+/g,'');bin=atob(b64)}
      else if(enc==='quoted-printable')bin=qpToBin(body);
      else bin=body;
    }catch{continue}
    parts.push({ct,cs:csm&&csm[1],loc:h['content-location'],cid:(h['content-id']||'').replace(/^<|>$/g,''),bin,b64});
  }
  const wantLoc=top['snapshot-content-location'];
  const main=parts.find(p=>p.ct==='text/html'&&(!wantLoc||p.loc===wantLoc))||parts.find(p=>p.ct==='text/html');
  if(!main)return null;
  const map=[];
  const uri=p=>`data:${p.ct};base64,${p.b64||btoa(p.bin)}`;
  const addKeys=(p,u)=>{
    if(p.loc){map.push([p.loc,u]);if(p.loc.includes('&'))map.push([p.loc.replace(/&/g,'&amp;'),u])}
    if(p.cid)map.push(['cid:'+p.cid,u]);
  };
  const rep=(text)=>{for(const [k,u] of map)if(k&&text.includes(k))text=text.split(k).join(u);return text};
  for(const p of parts)if(p!==main&&p.ct!=='text/css'&&p.ct!=='text/html')addKeys(p,uri(p));
  map.sort((a,b)=>b[0].length-a[0].length);
  for(const p of parts)if(p!==main&&p.ct==='text/css'){
    const css=rep(dec(str2bytes(p.bin),p.cs));
    addKeys(p,'data:text/css;base64,'+btoa(unescape(encodeURIComponent(css))));
  }
  map.sort((a,b)=>b[0].length-a[0].length);
  const html=rep(dec(str2bytes(main.bin),main.cs));
  return {html,location:wantLoc||main.loc||'',date:top.date?Date.parse(top.date):NaN};
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  const head=bin2str(buf.slice(0,2048));
  if(/\.mht(ml)?$/i.test(file.name)||(/^\s*(From|Subject|MIME-Version|Snapshot-Content-Location)\s*:/im.test(head)&&/multipart\/related/i.test(head))){
    const r=parseMhtml(bin2str(buf));
    if(r)return {raw:r.html,isText:false,url:r.location,date:r.date};
  }
  let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{
    const m=/charset\s*=\s*["']?([\w-]+)/i.exec(head);
    text=dec(new Uint8Array(buf),m?m[1]:'windows-1252');
  }
  return {raw:text,isText:/\.(txt|md)$/i.test(file.name)&&!looksHtml(text),url:'',date:NaN};
}

/* ---------- create snapshot ---------- */
async function makeSnap({url,ts,raw,isText,fallbackName}){
  let html=raw;
  if(isText||!looksHtml(raw))html=`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><pre style="white-space:pre-wrap;word-break:break-word;font:15px/1.7 -apple-system,sans-serif;padding:14px;margin:0">${esc(raw)}</pre>`;
  const doc=new DOMParser().parseFromString(html,'text/html');
  const text=htmlToText(html);
  let title=(doc.title||'').trim()||text.split('\n')[0]||'(無題)';
  title=title.slice(0,160);
  if(!url){
    const c=doc.querySelector('link[rel="canonical"]')?.getAttribute('href')||doc.querySelector('meta[property="og:url"]')?.getAttribute('content');
    url=normUrl(c&&/^https?:/i.test(c)?c:'')||('local:'+(fallbackName||'memo'));
  }
  const meta={url,title,ts:ts||Date.now(),size:html.length,hash:fnv(text),excerpt:text.slice(0,200).replace(/\n/g,' ')};
  return saveSnap(meta,{html,text});
}

/* ---------- diff ---------- */
function diffLines(A0,B0){
  let s=0;while(s<A0.length&&s<B0.length&&A0[s]===B0[s])s++;
  let ea=A0.length,eb=B0.length;while(ea>s&&eb>s&&A0[ea-1]===B0[eb-1]){ea--;eb--}
  const A=A0.slice(s,ea),B=B0.slice(s,eb),n=A.length,m=B.length;
  const pre=A0.slice(0,s).map(x=>({t:'=',s:x})),suf=A0.slice(ea).map(x=>({t:'=',s:x}));
  const mid=[];let approx=false;
  if(n*m>4e6){
    approx=true;const sa=new Set(A),sb=new Set(B);
    A.forEach(x=>{if(!sb.has(x))mid.push({t:'-',s:x})});B.forEach(x=>{if(!sa.has(x))mid.push({t:'+',s:x})});
  }else{
    const W=m+1,dp=new Uint16Array((n+1)*W);
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=A[i]===B[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
    let i=0,j=0;
    while(i<n&&j<m){
      if(A[i]===B[j]){mid.push({t:'=',s:A[i]});i++;j++}
      else if(dp[(i+1)*W+j]>=dp[i*W+j+1])mid.push({t:'-',s:A[i++]});
      else mid.push({t:'+',s:B[j++]});
    }
    while(i<n)mid.push({t:'-',s:A[i++]});while(j<m)mid.push({t:'+',s:B[j++]});
  }
  return {ops:[...pre,...mid,...suf],approx};
}

/* ---------- backup (optional passphrase, AES-GCM) ---------- */
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>str2bytes(atob(s));
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function buildExport(pass){
  const metas=await allSnaps();const items=[];
  for(const m of metas){const b=await getBody(m.id);const {id,...rest}=m;items.push({...rest,html:b.html})}
  const json=JSON.stringify({app:'pocket-wayback',v:1,items});
  if(!pass)return {blob:new Blob([json],{type:'application/json'}),ext:'json',n:items.length};
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(json)));
  const out=JSON.stringify({app:'pocket-wayback',v:1,enc:1,salt:b64e(salt),iv:b64e(iv),data:b64e(ct)});
  return {blob:new Blob([out],{type:'application/json'}),ext:'pwb',n:items.length};
}
async function importBackup(file){
  let obj=JSON.parse(await file.text());
  if(obj.app!=='pocket-wayback')throw new Error('形式が違います');
  if(obj.enc){
    const pass=prompt('バックアップのパスフレーズ');if(pass==null)return -1;
    const key=await deriveKey(pass,b64d(obj.salt));
    let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(obj.iv)},key,b64d(obj.data))}catch{throw new Error('パスフレーズが違います')}
    obj=JSON.parse(new TextDecoder().decode(pt));
  }
  const have=new Set((await allSnaps()).map(m=>m.url+'|'+m.ts+'|'+m.hash));
  let n=0;
  for(const it of obj.items){
    if(have.has(it.url+'|'+it.ts+'|'+it.hash))continue;
    const {html,...meta}=it;await saveSnap(meta,{html,text:htmlToText(html)});n++;
  }
  return n;
}

/* ---------- views ---------- */
const app=$('#app');
let searchQ='';
function setView(name,full){document.body.classList.toggle('full',!!full);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===name))}
const head=(title,back)=>`<header class="top">${back?`<a class="icon" href="${back}" style="text-decoration:none;color:inherit">‹</a>`:''}<h1>${title}</h1></header>`;

async function viewHome(){
  setView('home');
  app.innerHTML=head('Pocket Wayback')+`<main><input type="search" id="q" placeholder="URL・タイトル・本文を検索" value="${esc(searchQ)}" autocomplete="off"><div id="list" style="margin-top:12px"></div></main>`;
  const snaps=await allSnaps();
  const list=$('#list');
  const draw=async(deep)=>{
    const q=searchQ.trim().toLowerCase();
    if(!snaps.length){list.innerHTML=`<div class="empty">まだ何もありません。<br>「追加」からページを保存しましょう。<br><span class="mute">すべてこの端末の中だけに保存されます。</span></div>`;return}
    if(q&&deep){
      const hits=await scanBodies(q);
      const rows=snaps.filter(s=>hits.has(s.id)).sort((a,b)=>b.ts-a.ts);
      list.innerHTML=(rows.length?'':`<div class="empty">本文に一致なし</div>`)+rows.map(s=>`<a class="row card" href="#/v/${s.id}"><div class="host">${esc(s.title)}</div><div class="mute">${esc(s.url)} · ${fmtDate(s.ts)}</div><div class="mute">…${esc(hits.get(s.id))}…</div></a>`).join('');
      return;
    }
    const g=new Map();
    for(const s of snaps){let x=g.get(s.url);if(!x){x={url:s.url,n:0,last:s};g.set(s.url,x)}x.n++;if(s.ts>x.last.ts)x.last=s}
    let arr=[...g.values()];
    if(q)arr=arr.filter(x=>(x.url+' '+x.last.title+' '+x.last.excerpt).toLowerCase().includes(q));
    arr.sort((a,b)=>b.last.ts-a.last.ts);
    list.innerHTML=arr.map(x=>{const u=splitUrl(x.url);return `<a class="row card" href="#/u/${encodeURIComponent(x.url)}"><div class="host">${esc(u.host)}<span class="path">${esc(u.path.slice(0,60))}</span></div><div>${esc(x.last.title)}</div><div class="mute">${x.n}件 · 最新 ${fmtDate(x.last.ts)}</div></a>`}).join('')
      +(q?`<div class="row2"><button class="sec" id="deep">本文も検索</button></div>`:'')
      +(q&&!arr.length?`<div class="empty">一致なし</div>`:'');
    $('#deep')?.addEventListener('click',()=>draw(true));
  };
  $('#q').addEventListener('input',e=>{searchQ=e.target.value;draw(false)});
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')draw(true)});
  draw(false);
}

async function viewUrl(url){
  setView('home');
  const snaps=(await allSnaps()).filter(s=>s.url===url).sort((a,b)=>b.ts-a.ts);
  const u=splitUrl(url);
  app.innerHTML=head(esc(u.host),'#/')+`<main><div class="mute" style="word-break:break-all;margin-bottom:12px">${esc(url)}</div>
  <div id="snaps">${snaps.map((s,i)=>{const prev=snaps[i+1];const chg=prev&&prev.hash!==s.hash;
    return `<div class="card snap"><input type="checkbox" data-id="${s.id}"><a class="row body" href="#/v/${s.id}"><div><b>${fmtDate(s.ts)}</b>${prev?(chg?'<span class="pill chg">変更あり</span>':'<span class="pill">同一</span>'):''}</div><div>${esc(s.title)}</div><div class="mute">${fmtSize(s.size)}</div></a></div>`}).join('')||'<div class="empty">スナップショットなし</div>'}</div>
  <div class="row2"><button id="cmp" disabled>2件を比較</button><button class="danger" id="del" disabled>選択を削除</button><a class="btn sec" href="#/add?url=${encodeURIComponent(url)}">＋新しく保存</a></div></main>`;
  const upd=()=>{const n=document.querySelectorAll('#snaps input:checked').length;$('#cmp').disabled=n!==2;$('#del').disabled=n<1};
  $('#snaps').addEventListener('change',upd);
  $('#cmp').onclick=()=>{const ids=[...document.querySelectorAll('#snaps input:checked')].map(i=>+i.dataset.id);location.hash=`#/d/${ids[0]}/${ids[1]}`};
  $('#del').onclick=async()=>{const ids=[...document.querySelectorAll('#snaps input:checked')].map(i=>+i.dataset.id);if(!confirm(ids.length+'件を削除しますか?'))return;await delSnaps(ids);toast('削除しました');route()};
}

async function viewSnap(id){
  setView('home',true);
  const s=await getSnap(id);if(!s){location.hash='#/';return}
  const b=await getBody(id);
  const sib=(await allSnaps()).filter(x=>x.url===s.url).sort((a,b)=>b.ts-a.ts);
  const idx=sib.findIndex(x=>x.id===id);
  let mode='page';
  app.innerHTML=`<div class="viewer"><div class="vbar"><a class="icon" href="#/u/${encodeURIComponent(s.url)}" style="text-decoration:none;color:inherit">‹</a>
    <button class="icon" id="older" ${idx>=sib.length-1?'disabled':''}>◀</button>
    <select id="sel">${sib.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${fmtDate(x.ts)}</option>`).join('')}</select>
    <button class="icon" id="newer" ${idx<=0?'disabled':''}>▶</button>
    <button class="icon" id="mode" title="表示切替">Aa</button>
    <button class="icon" id="cmp1" title="前の版と比較" ${idx>=sib.length-1?'disabled':''}>±</button>
    <button class="icon" id="del1" title="削除">🗑</button></div>
    <div class="vwrap" id="vw"></div></div>`;
  const draw=()=>{
    const vw=$('#vw');vw.innerHTML='';
    if(mode==='page'){const f=document.createElement('iframe');f.setAttribute('sandbox','');f.setAttribute('referrerpolicy','no-referrer');f.srcdoc=b.html;vw.appendChild(f)}
    else{const p=document.createElement('pre');p.className='txt';p.textContent=b.text;vw.appendChild(p)}
  };
  draw();
  $('#sel').onchange=e=>location.hash='#/v/'+e.target.value;
  $('#older').onclick=()=>location.hash='#/v/'+sib[idx+1].id;
  $('#newer').onclick=()=>location.hash='#/v/'+sib[idx-1].id;
  $('#mode').onclick=()=>{mode=mode==='page'?'text':'page';draw()};
  $('#cmp1').onclick=()=>location.hash=`#/d/${sib[idx+1].id}/${id}`;
  $('#del1').onclick=async()=>{if(!confirm('このスナップショットを削除しますか?'))return;await delSnaps([id]);toast('削除しました');location.hash='#/u/'+encodeURIComponent(s.url)};
}

async function viewDiff(ia,ib){
  setView('home');
  let [a,b]=await Promise.all([getSnap(ia),getSnap(ib)]);
  if(!a||!b){location.hash='#/';return}
  if(a.ts>b.ts)[a,b]=[b,a];
  const [ba,bb]=await Promise.all([getBody(a.id),getBody(b.id)]);
  const {ops,approx}=diffLines(ba.text.split('\n'),bb.text.split('\n'));
  const add=ops.filter(o=>o.t==='+').length,del=ops.filter(o=>o.t==='-').length;
  const keep=new Array(ops.length).fill(false);
  ops.forEach((o,i)=>{if(o.t!=='='){for(let k=Math.max(0,i-2);k<=Math.min(ops.length-1,i+2);k++)keep[k]=true}});
  let html='',skip=0;
  ops.forEach((o,i)=>{
    if(!keep[i]){skip++;return}
    if(skip){html+=`<div class="d s">⋯ ${skip}行省略</div>`;skip=0}
    html+=`<div class="d ${o.t==='+'?'p':o.t==='-'?'m':'e'}">${o.t==='+'?'+ ':o.t==='-'?'− ':'  '}${esc(o.s)}</div>`;
  });
  if(skip)html+=`<div class="d s">⋯ ${skip}行省略</div>`;
  app.innerHTML=head('比較','#/u/'+encodeURIComponent(a.url))+`<main><div class="card"><div class="mute">旧 ${fmtDate(a.ts)}</div><div class="mute">新 ${fmtDate(b.ts)}</div><div style="margin-top:6px"><b style="color:var(--addt)">+${add}</b> &nbsp; <b style="color:var(--delt)">−${del}</b> 行${approx?'(簡易比較)':''}</div></div>${add+del?html:'<div class="empty">本文テキストに差分はありません</div>'}</main>`;
}

function viewAdd(q){
  setView('add');
  const pre=q.get('url')||'';
  app.innerHTML=head('ページを保存')+`<main>
  <label class="f">URL(空欄なら自動判定)</label>
  <input type="text" id="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://example.com/page" value="${esc(pre)}">
  <label class="f">保存日時(空欄なら自動: ファイルの更新日時 / 現在)</label>
  <input type="datetime-local" id="ts">
  <label class="f">① ファイルから(複数可: .mhtml / .html / .txt)</label>
  <input type="file" id="files" multiple accept=".mhtml,.mht,.html,.htm,.txt,.md,text/*,message/rfc822,multipart/related">
  <label class="f">② ソースやテキストを貼り付け</label>
  <textarea id="paste" placeholder="ここに貼り付け"></textarea>
  <div class="row2"><button class="sec" id="clip">クリップボードから貼り付け</button></div>
  <div class="row2"><button id="save">この端末に保存</button></div>
  <div class="note">Androidは Chrome の「ダウンロード → ページをダウンロード(MHTML)」、iOSは Safari の「共有 → Webアーカイブ」ではなく、リーダー/ファイル保存や「ページのソース」をコピーして貼り付けるのが確実です。画像・CSSは MHTML なら一緒に保存されます。<br>このアプリは<b>通信を一切行いません</b>(CSPで遮断)。URLの自動取得機能が無いのはそのためです。</div></main>`;
  $('#clip').onclick=async()=>{try{$('#paste').value=await navigator.clipboard.readText()}catch{toast('貼り付けを許可するか、手動で貼り付けてください')}};
  $('#save').onclick=async()=>{
    const btn=$('#save');btn.disabled=true;
    try{
      const url=normUrl($('#url').value);
      const manual=$('#ts').value?new Date($('#ts').value).getTime():0;
      const files=[...$('#files').files];let last,n=0;
      if(files.length){
        for(const f of files){
          const r=await readFile(f);
          last=await makeSnap({url:url||r.url,ts:manual||(isNaN(r.date)?f.lastModified:r.date),raw:r.raw,isText:r.isText,fallbackName:f.name});n++;
        }
      }else if($('#paste').value.trim()){
        last=await makeSnap({url,ts:manual||Date.now(),raw:$('#paste').value,isText:false,fallbackName:'memo-'+Date.now()});n=1;
      }else{toast('ファイルか本文を入力してください');btn.disabled=false;return}
      navigator.storage?.persist?.();
      toast(n+'件を保存しました');
      location.hash='#/u/'+encodeURIComponent(last.url);
    }catch(e){toast('保存失敗: '+(e&&e.name==='QuotaExceededError'?'容量不足':(e.message||e)));btn.disabled=false}
  };
}

async function viewSettings(){
  setView('s');
  const snaps=await allSnaps();
  const total=snaps.reduce((a,s)=>a+s.size,0);
  let est='';try{const e=await navigator.storage.estimate();est=`${fmtSize(e.usage||0)} / ${fmtSize(e.quota||0)}`}catch{est='不明'}
  let persisted='不明';try{persisted=(await navigator.storage.persisted())?'保護済み':'未保護'}catch{}
  app.innerHTML=head('設定')+`<main>
  <div class="card"><div class="kv"><span>スナップショット</span><b>${snaps.length}件</b></div><div class="kv"><span>HTML合計</span><b>${fmtSize(total)}</b></div><div class="kv"><span>ブラウザ使用量</span><b>${esc(est)}</b></div><div class="kv"><span>自動削除からの保護</span><b>${persisted}</b></div>
  <div class="row2"><button class="sec" id="persist">保護を要求</button></div></div>
  <h2>バックアップ</h2>
  <div class="card"><label class="f" style="margin-top:0">パスフレーズ(空欄=暗号化なし)</label><input type="text" id="pass" autocomplete="off" autocapitalize="off" placeholder="任意">
  <div class="row2"><button id="exp">書き出す</button><button class="sec" id="impb">読み込む</button></div><input type="file" id="impf" accept=".json,.pwb,application/json" hidden></div>
  <div class="note">ブラウザのサイトデータを消去すると保存内容も消えます。定期的に書き出してください。パスフレーズを忘れると復元できません。</div>
  <h2>プライバシー</h2>
  <div class="card mute">このページは Content-Security-Policy で外部通信を全面禁止しています(connect-src 'none')。保存ページは scripts 無効のサンドボックス内で表示され、外部リソースも読み込みません。データは IndexedDB のみに保存されます。</div>
  <h2>危険な操作</h2><div class="card"><button class="danger" id="wipe">すべて削除</button></div></main>`;
  $('#persist').onclick=async()=>{try{toast((await navigator.storage.persist())?'保護されました':'許可されませんでした')}catch{toast('非対応です')}viewSettings()};
  $('#exp').onclick=async()=>{
    try{
      const pass=$('#pass').value;const {blob,ext,n}=await buildExport(pass);
      const d=new Date();const name=`pocket-wayback-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.${ext}`;
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast(`${n}件を書き出しました`);
    }catch(e){toast('失敗: '+(e.message||e))}
  };
  $('#impb').onclick=()=>$('#impf').click();
  $('#impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const n=await importBackup(f);if(n>=0)toast(n+'件を取り込みました');viewSettings()}catch(err){toast('失敗: '+(err.message||err))}};
  $('#wipe').onclick=async()=>{if(!confirm('すべてのスナップショットを削除します。元に戻せません。'))return;if(!confirm('本当に削除しますか?'))return;await clearAll();toast('削除しました');viewSettings()};
}

/* ---------- router ---------- */
async function route(){
  const h=location.hash.slice(1)||'/';
  const [p,qs]=h.split('?');const seg=p.split('/').filter(Boolean).map(decodeURIComponent);
  window.scrollTo(0,0);
  try{
    switch(seg[0]){
      case 'add':return viewAdd(new URLSearchParams(qs||''));
      case 'u':return await viewUrl(seg.slice(1).join('/'));
      case 'v':return await viewSnap(+seg[1]);
      case 'd':return await viewDiff(+seg[1],+seg[2]);
      case 's':return await viewSettings();
      default:return await viewHome();
    }
  }catch(e){app.innerHTML=head('エラー')+`<main><div class="card">${esc(e.message||e)}</div></main>`}
}
window.addEventListener('hashchange',route);
(async()=>{
  if(!window.indexedDB){app.innerHTML='<main><div class="card">このブラウザは IndexedDB に対応していません。</div></main>';return}
  try{db=await openDB()}catch(e){app.innerHTML='<main><div class="card">保存領域を開けません(プライベートブラウズ中の可能性があります)。</div></main>';return}
  route();
})();
</script>
